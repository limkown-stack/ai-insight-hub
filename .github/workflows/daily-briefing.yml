name: Daily AI Briefing

on:
  schedule:
    # 每天 UTC 00:10（北京时间 08:10），即使电脑关机也会触发
    - cron: '10 0 * * *'
  workflow_dispatch:
    # 允许手动在 GitHub 页面点击 "Run workflow" 补跑任何一天

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Run daily briefing script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/daily_briefing.py

      - name: Commit and push archive update
        run: |
          git config user.email "limkown@gmail.com"
          git config user.name "Hazel (GitHub Actions)"
          git add index.html
          git diff --cached --quiet || git commit -m "daily briefing: $(date -u '+%Y-%m-%d') [auto]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
