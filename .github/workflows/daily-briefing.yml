name: Daily AI Briefing

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10，电脑关机也会触发
    - cron: '10 0 * * *'
  workflow_dispatch:
    # 可在 GitHub Actions 页面手动补跑

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests duckduckgo-search

      - name: Run briefing
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/daily_briefing.py

      - name: Commit archive update
        run: |
          git config user.email "limkown@gmail.com"
          git config user.name "Hazel (GitHub Actions)"
          git add index.html
          git diff --cached --quiet || git commit -m "daily briefing: $(date -u '+%Y-%m-%d') [auto]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
